services:
  vynode:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/minerport/vynodetemplatearr:0.1.0-rc.13
    container_name: vynode
    restart: unless-stopped
    ports:
      - "7171:7171"
    environment:
      VYNODE_PUBLIC_URL: ${VYNODE_PUBLIC_URL:-http://127.0.0.1:7171}
      VYNODE_MASTER_KEY: ${VYNODE_MASTER_KEY:?Set VYNODE_MASTER_KEY to a base64-encoded 32-byte key}
      VYNODE_TRUST_PROXY: ${VYNODE_TRUST_PROXY:-false}
      VYNODE_MEDIA_ROOTS: /media
      PUID: ${PUID:-99}
      PGID: ${PGID:-100}
    volumes:
      - ${VYNODE_CONFIG_PATH:-./config}:/var/lib/vynode
      - ${VYNODE_MEDIA_PATH:-./media}:/media
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
